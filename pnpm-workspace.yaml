# electron-forge@6 pulls @electron/node-gyp via a git-resolved subdependency.
# pnpm >=11 blocks exotic (git) subdeps by default; allow it so install /
# `pnpm <script>` pre-run dep-checks succeed for this Electron toolchain.
blockExoticSubdeps: false
allowBuilds:
  '@aymurai/ui': true
  # Must match the tarball SHA in pnpm-lock.yaml, or install fails with
  # ERR_PNPM_GIT_DEP_PREPARE_NOT_ALLOWED. package.json now pins the commit SHA
  # rather than the mutable `#v0.5.0` tag (which moved once and broke install),
  # so this only changes when @aymurai/ui is deliberately bumped.
  '@aymurai/ui@https://codeload.github.com/AymurAI/ui-components/tar.gz/93821cce3a0d82198d5acdf5c33cc1d2804cdbec': true
  '@biomejs/biome': true
  agent-browser: false
  electron: true
  electron-winstaller: true
  esbuild: true
  lefthook: true
minimumReleaseAgeExclude:
  - agent-browser@0.29.1
