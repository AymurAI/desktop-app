# Pre-commit and pre-push hooks. Installed automatically by `pnpm install` via
# the `prepare` script. Skip in any single run with `LEFTHOOK=0 git commit -m ...`.

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,jsx,ts,tsx,json,jsonc}"
      run: pnpm exec biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    panda-codegen:
      glob: "{panda.config.ts,src/renderer/src/**/*.{ts,tsx,css}}"
      run: pnpm exec panda codegen --silent

    forbidden-patterns:
      glob: "*.{js,jsx,ts,tsx}"
      # NOTE: POSIX ERE (-E), not PCRE (-P). macOS ships BSD grep, which has no
      # -P: it exited with a usage error, the `if` saw non-zero, and the hook
      # reported success while checking nothing. Word boundaries (\b) are also
      # PCRE-only, so console.log is matched as the literal call instead.
      # grep exit codes: 0 = matched, 1 = no match, >1 = grep itself failed.
      # A tool failure must fail the hook, never pass it.
      run: |
        matches=$(grep -EnH "console\.log[[:space:]]*\(|debugger;|^<<<<<<< |\.only\(|from ['\"]react-router-dom|from ['\"]@stitches/react" {staged_files})
        rc=$?
        if [ "$rc" -gt 1 ]; then
          echo "forbidden-patterns: grep failed (exit $rc) — failing closed."
          exit 1
        fi
        if [ "$rc" -eq 0 ]; then
          echo "$matches"
          echo ""
          echo "Forbidden pattern found in staged files."
          echo "Banned: console.log, debugger, leftover merge markers, .only( in tests,"
          echo "@stitches/react imports, react-router-dom imports."
          exit 1
        fi

pre-push:
  commands:
    typecheck:
      run: pnpm typecheck
    knip:
      run: pnpm exec knip --no-config-hints
